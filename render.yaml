services:
  - type: web
    name: torro-evri-client-tracking
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: EVRI_API_KEY
        sync: false
      - key: EVRI_CLIENT_ID
        sync: false
      - key: EVRI_CLIENT_SECRET
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: EVRI_DEBUG_PROOF
        value: "false"
